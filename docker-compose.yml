services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ECSAE_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true
  extractor-api:
    profiles: ["transformer"]
    build:
      context: .
      dockerfile: Dockerfile.extract
    ports:
      - "8001:8000"
    environment:
      ECSAE_REDIS_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
