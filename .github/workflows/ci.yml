name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip==25.2
      - run: python -m pip install -e '.[test]'
      - run: pytest -n auto --cov=ecsae --cov-report=term-missing
      - run: python tools/sync_readme_metrics.py --check
      - run: ecsae rerun tests/fixtures/rerun_records.jsonl --runs 2 --output eval/results/rerun-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.python-version }}
          path: eval/results/rerun-ci.json
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --check .
      - run: docker compose build api
      - run: docker compose up -d api redis
      - name: Probe containerized service
        run: |
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8000/health
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8000/ready
          curl --fail --retry 10 --retry-delay 2 \
            -H 'content-type: application/json' \
            --data '{"study_id":"ci-smoke","randomized_n":20,"arm_ns":{"a":10,"b":10}}' \
            http://127.0.0.1:8000/audit
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip==25.2
      - run: python -m pip install -e '.[science]'
      - name: Validate generated evidence and statistical oracles
        run: |
          python tools/sync_readme_metrics.py --check
          python tools/validate_statistics.py --output eval/results/statistical-validation-ci.json
          ecsae rerun tests/fixtures/rerun_records.jsonl --runs 2 --output eval/results/rerun-evidence-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-gate
          path: |
            eval/results/statistical-validation-ci.json
            eval/results/rerun-evidence-ci.json
  release-gate:
    if: always()
    needs: [test, docker, evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Require all release checks to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$DOCKER_RESULT" = success
          test "$EVIDENCE_RESULT" = success
          echo "Release gate passed: tests, evidence, rerun determinism, and Docker smoke validation."
