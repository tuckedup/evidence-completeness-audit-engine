name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install project
        run: |
          uv sync --frozen --python ${{ matrix.python-version }} --extra test

      - name: Run tests
        run: |
          uv run python -m pytest -q \
            --basetemp .pytest_tmp/ci-${{ matrix.python-version }}

  evidence:
    name: evidence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --python 3.12 --extra science

      - name: Validate statistical references
        run: |
          uv run python tools/validate_statistics.py

      - name: Check README evidence drift
        run: |
          uv run python tools/sync_readme_metrics.py --check

      - name: Determinism smoke
        run: |
          uv run python -m ecsae.cli rerun \
            tests/fixtures/rerun_records.jsonl \
            --runs 3 \
            --output /tmp/rerun-ci.json

      - name: Check rerun result
        run: |
          uv run python - <<'PY'
          import json

          with open("/tmp/rerun-ci.json", encoding="utf-8") as f:
              result = json.load(f)

          mismatch_count = result.get("mismatch_count", 0)

          if mismatch_count != 0:
              raise SystemExit(
                  f"determinism failure: {mismatch_count} mismatches"
              )

          print("determinism check passed")
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: evidence-gate
          path: /tmp/rerun-ci.json

  docker:
    name: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dockerfile static check
        run: |
          docker build --check -f Dockerfile .

      - name: Build core API image
        run: |
          docker build \
            --file Dockerfile \
            --tag ecsae-ci:latest \
            .

      - name: Start API container
        run: |
          docker run \
            --detach \
            --name ecsae-ci \
            --publish 8000:8000 \
            ecsae-ci:latest

      - name: Wait for API health
        shell: bash
        run: |
          set -euo pipefail

          ready=0

          for attempt in $(seq 1 45); do
            echo "health attempt ${attempt}/45"

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8000/health
            then
              ready=1
              break
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "API never became healthy"
            docker ps -a
            docker logs ecsae-ci || true
            exit 1
          fi

      - name: Check readiness
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            http://127.0.0.1:8000/ready

      - name: Submit real audit smoke request
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --header "Content-Type: application/json" \
            --data-binary @bench/payload.json \
            http://127.0.0.1:8000/audit \
            > /tmp/audit-response.json

          python -m json.tool /tmp/audit-response.json

      - name: Show container logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs ecsae-ci || true

      - name: Stop container
        if: always()
        run: |
          docker rm -f ecsae-ci || true

  release-gate:
    name: release-gate
    runs-on: ubuntu-latest

    if: always()

    needs:
      - test
      - evidence
      - docker

    steps:
      - name: Require all release checks
        shell: bash
        run: |
          echo "test:     ${{ needs.test.result }}"
          echo "evidence: ${{ needs.evidence.result }}"
          echo "docker:   ${{ needs.docker.result }}"

          if [ "${{ needs.test.result }}" != "success" ]; then
            exit 1
          fi

          if [ "${{ needs.evidence.result }}" != "success" ]; then
            exit 1
          fi

          if [ "${{ needs.docker.result }}" != "success" ]; then
            exit 1
          fi

          echo "release gate passed"
